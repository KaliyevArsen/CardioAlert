[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioalert"
version = "0.2.0"
description = "Reproducible educational heart-disease classification and screening interface"
requires-python = ">=3.11"
authors = [{name = "Arsen Kaliyev"}]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "xgboost==2.1.4",
  "joblib==1.5.3",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
bot = ["pyTelegramBotAPI==4.27.0"]
test = ["pytest==8.3.5"]

[project.scripts]
cardioalert = "cardioalert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
